<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="view-transition" content="same-origin" />
<title>Design library</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg></span><span>Design library</span></a>
    <form class="side-search" id="gsearch" role="search">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 1 0 3.3 9.9l3.6 3.6 1.1-1.1-3.6-3.6A5.5 5.5 0 0 0 8.5 3zm0 1.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input id="gq" type="search" placeholder="Search the library" aria-label="Search the library" autocomplete="off" />
    </form>
    <nav class="side-nav" id="sidenav"></nav>
    <div class="side-label">Channels</div>
    <nav class="side-channels" id="sidechannels"></nav>
    <div class="side-foot">
      <a href="#/agent" data-tab="agent" class="side-link"><svg viewBox="0 0 20 20"><path d="M10 2l1.6 4.4L16 8l-4.4 1.6L10 14l-1.6-4.4L4 8l4.4-1.6zM15.5 13l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>Use with your agent</span></a>
      <button class="side-link" id="theme" type="button"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 1.5v13a6.5 6.5 0 0 1 0-13z"/></svg><span>Light or dark</span></button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <a class="brand" href="#/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2 22 12 12 22 2 12z"/></svg></span><span>Design library</span></a>
      <a class="icon-btn" href="#/sources" aria-label="Search"><svg viewBox="0 0 20 20"><path d="M8.5 3a5.5 5.5 0 1 0 3.3 9.9l3.6 3.6 1.1-1.1-3.6-3.6A5.5 5.5 0 0 0 8.5 3zm0 1.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg></a>
      <button class="icon-btn" id="theme2" type="button" aria-label="Light or dark"><svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 1.5v13a6.5 6.5 0 0 1 0-13z"/></svg></button>
    </header>
    <main id="app" class="page"></main>
    <footer class="site-foot" id="foot"></footer>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
