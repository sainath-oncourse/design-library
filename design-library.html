<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Design library</title>
<style>:root {
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #f0f0ed;
  --text: #1a1a1a;
  --muted: #6b6b66;
  --border: #e4e4df;
  --accent: #2f5bea;
  --accent-text: #ffffff;
  --accent-soft: #e9eefd;
  --good: #1f7a4d;
  --good-soft: #e5f4ec;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111112; --surface: #1b1b1d; --surface-2: #242427; --text: #ededeb; --muted: #9a9a95;
    --border: #2e2e32; --accent: #7c9bff; --accent-text: #0d1330; --accent-soft: #1f2846;
    --good: #6fd3a0; --good-soft: #17301f; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111112; --surface: #1b1b1d; --surface-2: #242427; --text: #ededeb; --muted: #9a9a95;
  --border: #2e2e32; --accent: #7c9bff; --accent-text: #0d1330; --accent-soft: #1f2846;
  --good: #6fd3a0; --good-soft: #17301f; --shadow: none; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* header */
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.top-row { display: flex; align-items: center; gap: 24px; height: 56px; }
.brand { font-weight: 700; text-decoration: none; letter-spacing: -0.01em; }
.tabs { display: flex; gap: 4px; }
.tabs a { text-decoration: none; padding: 6px 12px; border-radius: 999px; color: var(--muted); font-weight: 500; }
.tabs a.active { background: var(--surface-2); color: var(--text); }
.theme { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-size: 16px; }

/* intro */
.intro { padding: 40px 0 16px; }
.intro h1 { font-size: 32px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 8px; }
.intro p { margin: 0 0 14px; max-width: 640px; }
.progress { height: 6px; max-width: 320px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--good); border-radius: inherit; transition: width .3s; }

/* filters */
.filters { padding: 12px 0 8px; display: grid; gap: 10px; }
.search { width: 100%; max-width: 520px; padding: 11px 14px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; outline: none; }
.search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.filter-label { width: 52px; font-size: 13px; color: var(--muted); }
.chip { font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
.chip .n { color: var(--muted); margin-left: 2px; }
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.on .n { color: inherit; opacity: .7; }
.link { font: inherit; font-size: 13px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 5px 6px; }

/* cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 8px 0 24px; }
.card { display: flex; flex-direction: column; gap: 8px; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); text-decoration: none; transition: transform .15s, border-color .15s; }
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.card.is-learned { opacity: .72; }
.card h2 { font-size: 17px; line-height: 1.3; margin: 0; letter-spacing: -0.01em; }
.card .did { margin: 0; color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.result { margin: 2px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--good-soft); color: var(--good); font-size: 13px; font-weight: 500; }
.result span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.result.none { background: var(--surface-2); color: var(--muted); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
.type { font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.tick { margin-left: auto; color: var(--good); font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; padding-top: 4px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.tag.goal { background: transparent; border: 1px solid var(--border); }

/* detail */
.back { display: inline-block; margin: 24px 0 8px; text-decoration: none; color: var(--muted); }
.back:hover { color: var(--text); }
.detail { max-width: 720px; padding-bottom: 24px; }
.detail h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.02em; margin: 10px 0 12px; }
.detail .tags { margin: 0 0 18px; }
.detail section { margin: 26px 0; }
.detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.detail p { margin: 0; }
.detail ul { margin: 0; padding-left: 20px; }
.detail li { margin: 6px 0; }
.ideas { list-style: none; padding: 0 !important; display: grid; gap: 10px; }
.ideas li { margin: 0 !important; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: grid; gap: 4px; }
.screen { font-size: 12px; font-weight: 600; color: var(--accent); }
.callout { padding: 14px 16px; border-radius: 12px; background: var(--good-soft); }
.callout h3 { color: var(--good); }
.callout.none { background: var(--surface-2); }
.callout.none h3 { color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; font: inherit; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn[aria-pressed="true"] { color: var(--good); border-color: var(--good); }
textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; resize: vertical; outline: none; }
textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.related h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* experiments */
.exp-list { display: grid; gap: 14px; padding-bottom: 32px; }
.exp { padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.exp h2 { font-size: 18px; margin: 8px 0 6px; }
.exp p { margin: 6px 0; }
.status { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 7px; border-radius: 5px; background: var(--surface-2); }
.status.s-won { background: var(--good-soft); color: var(--good); }
.status.s-running, .status.s-picked, .status.s-prototyping { background: var(--accent-soft); color: var(--accent); }

/* empty + footer */
.empty { text-align: center; padding: 56px 16px; display: grid; gap: 6px; justify-items: center; }
.empty p { margin: 0; max-width: 460px; }
.empty .btn { margin-top: 12px; }
.foot { padding: 16px 0 40px; border-top: 1px solid var(--border); margin-top: 8px; }

@media (max-width: 600px) {
  .wrap { padding: 0 16px; }
  .intro h1 { font-size: 26px; }
  .grid { grid-template-columns: 1fr; }
  .filter-label { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

   "Results": "FitnessAI: 'conversion rates went up 80%', and installs reaching the paywall went 'from like 40% to 85%', with most converting further down the funnel. On the hidden cheaper plan, the transcript reads '10-15 of subscribers are on a plan that you can't even subscribe to in the app' (unit missing, likely %). Citizen: video was 'flat'; no other numbers.",

   "What they did": "Cancellation flows that route by survey answer: 'too expensive' gets a temporary discount or a hidden cheaper tier, 'negative experience' goes to support, 'too busy' gets a pause, which Codecademy used for people who learn in bursts. Also rewrote Codecademy's checkout error copy and added dunning emails for failed payments.",

</script>
<script>(() => {
  const { sources, experiments, built } = window.LIBRARY;
  const app = document.getElementById("app");

  // ---------- personal state (this browser only) ----------
  const store = {
    get: (k, d) => { try { return JSON.parse(localStorage.getItem("dl:" + k)) ?? d; } catch { return d; } },
    set: (k, v) => localStorage.setItem("dl:" + k, JSON.stringify(v)),
  };
  let learned = new Set(store.get("learned", []));
  const notes = store.get("notes", {});
  const filters = { q: "", topic: null, goal: null, type: null, unread: false, results: false };

  // ---------- theme ----------
  const root = document.documentElement;
  const applyTheme = (t) => { if (t) root.dataset.theme = t; else delete root.dataset.theme; };
  const qs = new URLSearchParams(location.search).get("theme");
  applyTheme(qs || store.get("theme", null));
  document.getElementById("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const next = dark ? "light" : "dark";
    store.set("theme", next); applyTheme(next);
  };

  // ---------- helpers ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return ""; } };
  const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);
  const splitTakeaways = (t) => (t || "").split(/;\s+/).filter(Boolean).map(cap);
  // "Paywall: do X. Onboarding: do Y." -> one bullet per screen
  const splitIdeas = (t) => (t || "").split(/(?<=[.!?'])\s+(?=[A-Z][\w/' -]{2,40}:\s)/).filter(Boolean);
  const ideaParts = (i) => { const m = i.match(/^([A-Z][\w/' -]{2,40}):\s+(.*)$/s); return m ? [m[1], m[2]] : [null, i]; };
  const uniq = (key) => [...new Set(sources.flatMap((s) => [].concat(s[key] || [])))].sort();
  const count = (key, v) => sources.filter((s) => [].concat(s[key] || []).includes(v)).length;

  const matches = (s) => {
    if (filters.topic && !(s.Topics || []).includes(filters.topic)) return false;
    if (filters.goal && !(s.Goal || []).includes(filters.goal)) return false;
    if (filters.type && s.Type !== filters.type) return false;
    if (filters.unread && learned.has(s.id)) return false;
    if (filters.results && !s.Results) return false;
    if (filters.q) {
      const hay = [s.Title, s.Creator, s["What they did"], s.Results, s.Takeaways, s["Ideas for OnCourse"], (s.Topics || []).join(" ")].join(" ").toLowerCase();
      return filters.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
    }
    return true;
  };

  const chipRow = (label, key, values, field) => `
    <div class="filter-row" role="group" aria-label="${label}">
      <span class="filter-label">${label}</span>
      ${values.map((v) => `<button type="button" class="chip ${filters[key] === v ? "on" : ""}" data-f="${key}" data-v="${esc(v)}" aria-pressed="${filters[key] === v}">${esc(v)} <span class="n">${count(field, v)}</span></button>`).join("")}
    </div>`;

  // ---------- list ----------
  function renderList() {
    const list = sources.filter(matches);
    const learnedCount = sources.filter((s) => learned.has(s.id)).length;
    app.innerHTML = `
      <section class="intro">
        <h1>What other apps tried, and what happened</h1>
        <p class="muted">${sources.length} videos, talks and case studies, read for you, each with ideas for OnCourse. You've learned ${learnedCount} of ${sources.length}.</p>
        <div class="progress" aria-hidden="true"><span style="width:${sources.length ? (learnedCount / sources.length) * 100 : 0}%"></span></div>
      </section>

      <section class="filters">
        <input id="q" class="search" type="search" placeholder="Search: streak, paywall, trial reminder…" value="${esc(filters.q)}" aria-label="Search sources" />
        ${chipRow("Topic", "topic", uniq("Topics"), "Topics")}
        ${chipRow("Goal", "goal", uniq("Goal"), "Goal")}
        ${chipRow("Type", "type", uniq("Type"), "Type")}
        <div class="filter-row">
          <span class="filter-label">Show</span>
          <button type="button" class="chip ${filters.results ? "on" : ""}" data-toggle="results" aria-pressed="${filters.results}">With numbers</button>
          <button type="button" class="chip ${filters.unread ? "on" : ""}" data-toggle="unread" aria-pressed="${filters.unread}">Not learned yet</button>
          ${Object.entries(filters).some(([k, v]) => v && k !== "q") || filters.q ? `<button type="button" class="link" id="clear">Clear all</button>` : ""}
        </div>
      </section>

      <p class="muted small">${list.length === sources.length ? "" : `${list.length} of ${sources.length} sources`}</p>
      ${list.length ? `<section class="grid">${list.map(card).join("")}</section>` :
        `<div class="empty"><p><strong>Nothing matches.</strong></p><p class="muted">Try fewer filters, or a different word.</p><button type="button" class="btn" id="clear2">Clear filters</button></div>`}
      <footer class="foot muted small">Updated ${built}. Ask the agent to add a link, or edit <code>data/sources.json</code> and run <code>node build.mjs</code>.</footer>
    `;

    const q = document.getElementById("q");
    q.oninput = () => { filters.q = q.value; const pos = q.selectionStart; renderList(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
    app.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { const k = b.dataset.f; filters[k] = filters[k] === b.dataset.v ? null : b.dataset.v; renderList(); });
    app.querySelectorAll("[data-toggle]").forEach((b) => b.onclick = () => { filters[b.dataset.toggle] = !filters[b.dataset.toggle]; renderList(); });
    const clear = () => { Object.assign(filters, { q: "", topic: null, goal: null, type: null, unread: false, results: false }); renderList(); };
    document.getElementById("clear")?.addEventListener("click", clear);
    document.getElementById("clear2")?.addEventListener("click", clear);
  }

  function card(s) {
    const firstResult = s.Results ? s.Results.split(/(?<=\.)\s/)[0] : null;
    return `
      <a class="card ${learned.has(s.id) ? "is-learned" : ""}" href="#/s/${s.id}">
        <div class="meta"><span class="type t-${esc((s.Type || "").toLowerCase().replace(/\s/g, "-"))}">${esc(s.Type)}</span><span class="muted">${esc(host(s.Link))}</span>${learned.has(s.id) ? `<span class="tick" title="Learned">✓ Learned</span>` : ""}</div>
        <h2>${esc(s.Title)}</h2>
        <p class="did">${esc(s["What they did"])}</p>
        ${firstResult ? `<p class="result"><span>${esc(firstResult)}</span></p>` : `<p class="result none">No numbers in the source</p>`}
        <div class="tags">${(s.Topics || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>
      </a>`;
  }

  // ---------- detail ----------
  function renderDetail(id) {
    const s = sources.find((x) => x.id === id);
    if (!s) { app.innerHTML = `<div class="empty"><p><strong>That source isn't in the library.</strong></p><a class="btn" href="#/">Back to all sources</a></div>`; return; }
    const isLearned = learned.has(s.id);
    const related = sources.filter((x) => x.id !== s.id && (x.Topics || []).some((t) => (s.Topics || []).includes(t))).slice(0, 3);
    app.innerHTML = `
      <a class="back" href="#/">← All sources</a>
      <article class="detail">
        <div class="meta"><span class="type t-${esc((s.Type || "").toLowerCase().replace(/\s/g, "-"))}">${esc(s.Type)}</span><span class="muted">${esc(s.Creator)}</span></div>
        <h1>${esc(s.Title)}</h1>
        <div class="tags">${(s.Topics || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}${(s.Goal || []).map((g) => `<span class="tag goal">${esc(g)}</span>`).join("")}</div>

        <div class="actions">
          <a class="btn primary" href="${esc(s.Link)}" target="_blank" rel="noopener">Open the source ↗</a>
          <button type="button" class="btn" id="learn" aria-pressed="${isLearned}">${isLearned ? "✓ Learned" : "Mark as learned"}</button>
        </div>

        <section><h3>What they did</h3><p>${esc(s["What they did"])}</p></section>
        <section class="callout ${s.Results ? "" : "none"}"><h3>What happened</h3><p>${s.Results ? esc(s.Results) : "The source gives no numbers. Treat it as an idea, not a proven result."}</p></section>
        <section><h3>Takeaways</h3><ul>${splitTakeaways(s.Takeaways).map((t) => `<li>${esc(t)}</li>`).join("")}</ul></section>
        <section><h3>Ideas for OnCourse</h3><ul class="ideas">${splitIdeas(s["Ideas for OnCourse"]).map((i) => { const [screen, text] = ideaParts(i); return `<li>${screen ? `<span class="screen">${esc(screen)}</span>` : ""}<span>${esc(cap(text))}</span></li>`; }).join("")}</ul></section>
        ${s["Used in"] ? `<section><h3>Used in</h3><p>${esc(s["Used in"])}</p></section>` : ""}

        <section><h3>My notes</h3><textarea id="notes" rows="4" placeholder="What did you learn? What would you try?">${esc(notes[s.id] || "")}</textarea><p class="muted small" id="saved">Saved in this browser.</p></section>
        <p class="muted small">Added ${esc(s.Added || "")} · Read by the agent from the source itself.</p>
      </article>
      ${related.length ? `<section class="related"><h3>Related</h3><div class="grid">${related.map(card).join("")}</div></section>` : ""}
    `;
    document.getElementById("learn").onclick = () => {
      learned.has(s.id) ? learned.delete(s.id) : learned.add(s.id);
      store.set("learned", [...learned]); renderDetail(id);
    };
    const ta = document.getElementById("notes");
    ta.oninput = () => { notes[s.id] = ta.value; store.set("notes", notes); };
    scrollTo(0, 0);
  }

  // ---------- experiments ----------
  function renderExperiments() {
    const byWeek = [...experiments].sort((a, b) => String(b.Week).localeCompare(String(a.Week)));
    app.innerHTML = `
      <section class="intro">
        <h1>Weekly experiments</h1>
        <p class="muted">One or two ideas a week, picked from the sources and OnCourse's own data.</p>
      </section>
      ${byWeek.length ? `<section class="exp-list">${byWeek.map((e) => `
        <article class="exp">
          <div class="meta"><span class="status s-${esc(String(e.Status || "").toLowerCase())}">${esc(e.Status || "Proposed")}</span><span class="muted">Week of ${esc(e.Week || "")} · ${esc(e.Area || "")} · ${esc(e.Goal || "")}</span>${e.Effort ? `<span class="muted">Effort ${esc(e.Effort)}</span>` : ""}</div>
          <h2>${esc(e.Experiment)}</h2>
          <p>${esc(e.Hypothesis)}</p>
          ${e.Data ? `<p class="small"><strong>Data:</strong> ${esc(e.Data)}</p>` : ""}
          ${e["Based on"] ? `<p class="small"><strong>Based on:</strong> ${esc(e["Based on"])}</p>` : ""}
          ${e.Result ? `<p class="callout"><strong>Result:</strong> ${esc(e.Result)}</p>` : ""}
        </article>`).join("")}</section>` :
      `<div class="empty"><p><strong>No experiments yet.</strong></p><p class="muted">Ask the agent for "this week's design experiments". It finds the biggest leak in PostHog, matches it to what other apps did, and proposes one or two to try.</p><a class="btn" href="#/">Browse sources</a></div>`}
    `;
  }

  // ---------- router ----------
  function route() {
    const h = location.hash || "#/";
    const tab = h.startsWith("#/experiments") ? "experiments" : "sources";
    document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("active", a.dataset.tab === tab));
    if (h.startsWith("#/s/")) renderDetail(decodeURIComponent(h.slice(4)));
    else if (tab === "experiments") renderExperiments();
    else renderList();
  }
  addEventListener("hashchange", route);
  route();
})();
</script>
